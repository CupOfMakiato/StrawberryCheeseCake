                font-family: var(--sans);

                justify-content: center;
            }

            .frame {
                width: 100%;
                max-width: 1280px;
            }

                font-size: 0.66rem;

                letter-spacing: 0.18em;
                text-transform: uppercase;
            }
            h1 {
                margin-bottom: 0.5rem;
                font-family: var(--serif);
                font-size: clamp(1.75rem, 2.4vw + 0.75rem, 2.5rem);
                font-weight: 400;
                letter-spacing: -0.02em;
                line-height: 1.1;
            }
            .subtitle {
                max-width: 64rem;
                margin-bottom: 1.5rem;
                color: var(--muted);
                font-size: 0.875rem;
                line-height: 1.5;
            }
            .diagram {
                width: 100%;
                overflow-x: auto;
            }
            svg {
                width: 100%;
                min-width: 960px;
                display: block;
            }
        </style>
